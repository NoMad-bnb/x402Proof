name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    env:
      X402_API_URL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Seed providers.json (registry file is gitignored)
        run: |
          cat > providers.json <<'JSON'
          [
            {
              "provider_id": "seed-provider",
              "label": "CI seed provider",
              "facilitator_base_url": "https://seed.invalid",
              "supported_url": null,
              "verify_url": null,
              "settle_url": null,
              "known_declaration_url": null,
              "networks": [],
              "last_seen": null,
              "status": null
            }
          ]
          JSON

      - name: Module self-tests (12)
        run: |
          python scheduler.py --self-test
          python health.py
          python retry.py
          python claim_builder.py
          python settlement_hash_extractor.py
          python evidence_store.py
          python pending_tracker.py
          python contract_callers.py
          python rpc_verification_adapter.py
          python batch_evidence_capture.py
          python database.py
          python consensus_observer.py self-test

      - name: Integration and contract tests (7 files)
        run: |
          python test_a6_integration.py
          python test_a7_integration.py
          python test_a8_integration.py
          python test_a9_integration.py
          python test_a10_integration.py
          python test_ambiguous_multi_transfer.py
          python test_upto_amount_semantics.py

      - name: API tests
        run: python test_api_integration.py
